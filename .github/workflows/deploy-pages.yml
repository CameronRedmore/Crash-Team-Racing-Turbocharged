name: Deploy latest release Web build

# Builds the fork's own Web build. Note that the fork's Web build is not built
# anywhere else in CI, so this workflow is also the only thing that compiles the
# EMSCRIPTEN code paths. If it fails, the build job fails and the deploy job is
# skipped, so the previously deployed site stays up rather than being replaced
# with a broken one.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Records what is being deployed. This used to check out ref: vita and
      # then git-describe the newest v* tag reachable from origin/vita, which
      # pinned the deployment to an upstream High Octane release commit. Even
      # pointed at turbocharged that would have been wrong: the fork's commits
      # sit on top of upstream's v.1.4.1, so describe still resolves to that
      # upstream tag and the deployed build would have been upstream code while
      # the README advertised Turbocharged's [PC/Web] features.
      #
      # It now builds the ref that triggered the run: a tag push builds that
      # tag, and workflow_dispatch builds whichever branch it was started from.
      # Deploying Turbocharged therefore means pushing a Turbocharged tag.
      - name: Record what is being built
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            label="${GITHUB_REF_NAME}"
          else
            label="${GITHUB_REF_NAME} (branch tip)"
          fi

          if [[ ! -f web/shell.html ]]; then
            echo "${GITHUB_REF_NAME} has no web/shell.html, so it has no Web build support." >&2
            exit 1
          fi

          echo "tag=${label}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building Web release ${label} ($(git rev-parse --short=12 HEAD)) from ${GITHUB_REF}"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Emscripten 6.0.9
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.9
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.9

      - name: Build WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-web

          mkdir -p site
          cp build-web/ctr-native.html site/index.html
          cp build-web/ctr-native.js site/ctr-native.js
          cp build-web/ctr-native.wasm site/ctr-native.wasm
          cp build-web/ctr-native.data site/ctr-native.data

      - name: Record deployed release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          printf '%s\n' "$RELEASE_TAG" > site/release-tag.txt
          {
            echo "### GitHub Pages Web build"
            echo ""
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$RELEASE_COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
